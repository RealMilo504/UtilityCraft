name: Test Discord Release Announcement

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional tag; leave empty to use the latest release
        required: false
        type: string
      ping_updates:
        description: Mention the configured Updates role
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview-or-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load release and create announcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SEND_TO_DISCORD: true
          PING_UPDATES: ${{ inputs.ping_updates }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          DISCORD_UPDATES_ROLE_ID: ${{ vars.DISCORD_UPDATES_ROLE_ID }}
          PROJECT_NAME: UtilityCraft
          PROJECT_PAGE_URL: https://doriosstudios.com/projects/utilitycraft/
          CURSEFORGE_URL: https://www.curseforge.com/minecraft-bedrock/addons/utilitycraft
          MCPEDL_URL: https://mcpedl.com/utilitycraft/
          ANNOUNCEMENT_IMAGE_URL: https://doriosstudios.com/img/addons/utilitycraft/MCPEDL.png
          ANNOUNCEMENT_COLOR: "769050"
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            RELEASE_ENDPOINT="repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          else
            RELEASE_ENDPOINT="repos/$GITHUB_REPOSITORY/releases/latest"
          fi

          gh api "$RELEASE_ENDPOINT" | node tools/discord-release-announcement.mjs
