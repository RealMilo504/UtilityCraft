name: Publish Discord Release Announcement

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to announce (leave blank for the latest release)
        required: false
        type: string
      ping_updates:
        description: Mention the configured Updates role
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  statuses: write

jobs:
  announce:
    runs-on: ubuntu-latest
    concurrency:
      group: discord-release-${{ github.repository }}-manual
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish or preview Discord announcement
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
          DISCORD_UPDATES_ROLE_ID: ${{ vars.DISCORD_UPDATES_ROLE_ID }}
          SEND_TO_DISCORD: ${{ vars.DISCORD_ANNOUNCEMENT_MODE == 'manual' }}
          PING_UPDATES: ${{ inputs.ping_updates }}
          CURSEFORGE_PROCESSING_WARNING: false
          FETCH_GITHUB_RELEASE: true
          RELEASE_TAG: ${{ inputs.release_tag }}
          PROJECT_NAME: UtilityCraft
          PROJECT_PAGE_URL: https://doriosstudios.com/projects/utilitycraft/
          CURSEFORGE_URL: https://www.curseforge.com/minecraft-bedrock/addons/utilitycraft
          MCPEDL_URL: https://mcpedl.com/utilitycraft/
          ANNOUNCEMENT_IMAGE_URL: https://doriosstudios.com/img/addons/utilitycraft/MCPEDL.png
          ANNOUNCEMENT_COLOR: 769050
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANNOUNCEMENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/discord-release-announcement.mjs
