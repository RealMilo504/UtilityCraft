name: Release Addon

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release and announcement mode
        required: true
        type: choice
        default: release_announce_ping
        options:
          - release_announce_ping
          - release_announce
          - release_only
          - announce_only
      release_tag:
        description: Optional existing/explicit tag; blank uses the active changelog version
        required: false
        type: string
        default: ""
      release_channel:
        description: Release channel
        required: true
        type: choice
        default: project_default
        options:
          - project_default
          - stable
          - beta
          - alpha
      announcement_ping:
        description: Mention Updates for announce_only
        required: true
        type: boolean
        default: false
      execution:
        description: Preview is read-only; production publishes
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      production_confirmation:
        description: Type PUBLISH when execution is production
        required: false
        type: string
        default: ""

permissions:
  contents: write
  statuses: write

jobs:
  release:
    uses: DoriosStudios/Dorios-Workflows/.github/workflows/release-addon.yml@v1.0.2
    with:
      operation: ${{ inputs.operation }}
      release_tag: ${{ inputs.release_tag }}
      release_channel: ${{ inputs.release_channel }}
      announcement_ping: ${{ inputs.announcement_ping }}
      workflow_ref: v1.0.2
      preview_only: ${{ inputs.execution == 'preview' }}
      production_confirmation: ${{ inputs.production_confirmation }}
    secrets:
      discord_webhook: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
      curseforge_token: ${{ secrets.CURSEFORGE_API_TOKEN }}
