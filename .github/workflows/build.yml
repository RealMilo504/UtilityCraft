name: Build Addon

on:
  release:
    types: [published]

jobs:
  build-addon:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare release variables
        env:
          RELEASE_TITLE: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG_NAME="${RELEASE_TAG:-$GITHUB_REF_NAME}"

          if [ -z "$TAG_NAME" ]; then
            echo "::error::Release tag could not be resolved."
            exit 1
          fi

          REL_TITLE="${RELEASE_TITLE:-$TAG_NAME}"
          FILE_NAME="$(printf '%s' "$REL_TITLE" | tr ' ' '_' | tr -cd '[:alnum:]_.-')"

          if [ -z "$FILE_NAME" ]; then
            FILE_NAME="$(printf '%s' "$TAG_NAME" | tr ' ' '_' | tr -cd '[:alnum:]_.-')"
          fi

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "REL_TITLE=$REL_TITLE" >> "$GITHUB_ENV"
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Regolith
        run: |
          curl -L https://github.com/Bedrock-OSS/regolith/releases/download/1.8.0/regolith_1.8.0_linux_amd64.tar.gz -o regolith.tar.gz
          tar -xzf regolith.tar.gz
          sudo mv regolith /usr/local/bin/regolith
          regolith --version

      - name: Build dev addon
        run: |
          rm -rf build artifacts
          regolith run buildDev
          mkdir -p artifacts
          cd build
          zip -r "../artifacts/${FILE_NAME}_dev.mcaddon" "UtilityCraft BP" "UtilityCraft RP"

      - name: Build minified addon
        run: |
          rm -rf build
          regolith run buildMinify
          cd build
          zip -r "../artifacts/${FILE_NAME}.mcaddon" "UtilityCraft BP" "UtilityCraft RP"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG_NAME" \
            "artifacts/${FILE_NAME}_dev.mcaddon" \
            "artifacts/${FILE_NAME}.mcaddon" \
            --clobber

      - name: Upload minified addon to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_CHANGELOG: ${{ github.event.release.body }}
          CURSEFORGE_DISPLAY_NAME: ${{ github.event.release.name }}
          CURSEFORGE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if [ -z "$CURSEFORGE_API_TOKEN" ]; then
            echo "::error::The CURSEFORGE_API_TOKEN organization secret is not available to this repository."
            exit 1
          fi

          if [ "$CURSEFORGE_PRERELEASE" = "true" ]; then
            RELEASE_TYPE="beta"
          else
            RELEASE_TYPE="release"
          fi

          METADATA="$(jq -nc \
            --arg changelog "${CURSEFORGE_CHANGELOG:-No changelog provided.}" \
            --arg displayName "${CURSEFORGE_DISPLAY_NAME:-$REL_TITLE}" \
            --arg releaseType "$RELEASE_TYPE" \
            --arg gameVersion "26.30" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: [$gameVersion],
              releaseType: $releaseType,
              isMarkedForManualRelease: false
            }')"

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            --form-string "metadata=$METADATA" \
            --form "file=@artifacts/${FILE_NAME}.mcaddon" \
            "https://minecraft-bedrock.curseforge.com/api/projects/1095313/upload-file")"

          FILE_ID="$(printf '%s' "$RESPONSE" | jq -er '.id')"
          echo "CurseForge file uploaded successfully: $FILE_ID"
          echo "### CurseForge" >> "$GITHUB_STEP_SUMMARY"
          echo "Uploaded file ID: $FILE_ID" >> "$GITHUB_STEP_SUMMARY"
